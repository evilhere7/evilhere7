<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c3a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Ambient Glow circles -->
  <circle cx="200" cy="180" r="140" fill="#00f5a0" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="280" r="160" fill="#3b82f6" opacity="0.1" filter="url(#glow)"/>

  <!-- Nepal Mountain Skyline silhouette in background -->
  <path d="M 50 350 L 180 220 L 260 290 L 400 170 L 520 280 L 640 190 L 750 350 Z" fill="rgba(255, 255, 255, 0.02)" />

  <!-- Central E-Commerce / Logistics Illustration -->
  <g transform="translate(160, 60)">
    <!-- Platform Base / Glass Card -->
    <rect x="0" y="40" width="480" height="260" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Header bar -->
    <rect x="0" y="40" width="480" height="40" rx="16" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="25" cy="60" r="5" fill="#ef4444" />
    <circle cx="42" cy="60" r="5" fill="#f59e0b" />
    <circle cx="59" cy="60" r="5" fill="#10b981" />
    <rect x="100" y="52" width="280" height="16" rx="8" fill="rgba(255, 255, 255, 0.06)" />

    <!-- 3D Isometric / Stylized Warehouse Box -->
    <g transform="translate(60, 110)">
      <!-- Box Top -->
      <polygon points="60,10 110,35 60,60 10,35" fill="#00f5a0" opacity="0.8" />
      <!-- Box Left -->
      <polygon points="10,35 60,60 60,120 10,95" fill="#00c878" opacity="0.9" />
      <!-- Box Right -->
      <polygon points="60,60 110,35 110,95 60,120" fill="#00a86b" />
      <!-- Box Seam -->
      <line x1="60" y1="60" x2="60" y2="120" stroke="#065f46" stroke-width="1.5" />
      <path d="M 35 48 L 85 23" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2" opacity="0.7"/>
    </g>

    <!-- Logistics Network Nodes -->
    <g transform="translate(220, 110)">
      <!-- Connection lines -->
      <path d="M 30 50 L 100 20 L 180 60 L 110 110 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="6,4" />
      
      <!-- Nodes -->
      <circle cx="30" cy="50" r="14" fill="#1e293b" stroke="#00f5a0" stroke-width="2" />
      <circle cx="100" cy="20" r="12" fill="#1e293b" stroke="#00d2ff" stroke-width="2" />
      <circle cx="180" cy="60" r="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
      <circle cx="110" cy="110" r="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
      
      <!-- Mini icons / indicators -->
      <circle cx="30" cy="50" r="5" fill="#00f5a0" />
      <circle cx="100" cy="20" r="4" fill="#00d2ff" />
      <circle cx="180" cy="60" r="5" fill="#8b5cf6" />
      <circle cx="110" cy="110" r="4" fill="#3b82f6" />
    </g>

    <!-- Project Badge -->
    <rect x="180" y="240" width="120" height="28" rx="14" fill="url(#primaryGrad)" />
    <text x="240" y="258" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#090d16" text-anchor="middle" letter-spacing="1">GODAM360</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="395" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">E-Commerce &amp; Logistics Platform</text>
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" text-anchor="middle">React • TypeScript • Node.js • PostgreSQL • Supabase</text>
</svg>
