<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />
  
  <!-- Subtle Outer Border -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#neonEmerald)" stroke-width="4" opacity="0.8" />
  
  <!-- Cyber Hex Grid Background -->
  <g opacity="0.15" stroke="#00f5a0" stroke-width="1">
    <polygon points="200,60 230,80 230,110 200,130 170,110 170,80" fill="none" />
    <polygon points="120,110 150,130 150,160 120,180 90,160 90,130" fill="none" />
    <polygon points="280,110 310,130 310,160 280,180 250,160 250,130" fill="none" />
  </g>

  <!-- Ambient Glow Behind Avatar -->
  <circle cx="200" cy="180" r="90" fill="#00f5a0" opacity="0.15" filter="url(#avatarGlow)" />
  <circle cx="200" cy="220" r="110" fill="#8b5cf6" opacity="0.12" filter="url(#avatarGlow)" />

  <!-- Developer Silhouette / Character -->
  <!-- Hoodie Shoulders -->
  <path d="M 90 380 C 100 300, 140 270, 200 270 C 260 270, 300 300, 310 380 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <path d="M 140 380 L 175 280 L 200 330 L 225 280 L 260 380 Z" fill="#0f172a" opacity="0.9" />

  <!-- Nepal Flag Badge on Chest -->
  <g transform="translate(188, 320) scale(0.6)">
    <polygon points="0,0 24,14 7,14 26,30 0,30" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <circle cx="8" cy="8" r="3" fill="#ffffff"/>
    <circle cx="9" cy="22" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Head / Face / Hoodie Mask -->
  <ellipse cx="200" cy="190" rx="58" ry="68" fill="#1e293b" stroke="#00f5a0" stroke-width="2" />
  
  <!-- Cyber Visor / Glasses with Code Reflections -->
  <rect x="155" y="170" width="90" height="28" rx="8" fill="#090d16" stroke="url(#neonEmerald)" stroke-width="2" />
  <text x="162" y="188" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#00f5a0">&lt;DEV/&gt;</text>
  <text x="215" y="188" font-family="'Courier New', monospace" font-weight="bold" font-size="12" fill="#00d2ff">_01</text>

  <!-- Headphones -->
  <path d="M 135 185 C 135 130, 265 130, 265 185" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
  <rect x="130" y="170" width="14" height="36" rx="6" fill="#00f5a0" />
  <rect x="256" y="170" width="14" height="36" rx="6" fill="#00f5a0" />

  <!-- Code brackets floating near avatar -->
  <text x="70" y="160" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#00f5a0" opacity="0.7">{</text>
  <text x="310" y="160" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#8b5cf6" opacity="0.7">}</text>
  <text x="65" y="240" font-family="'Courier New', monospace" font-size="16" fill="#00d2ff" opacity="0.6">&lt;/&gt;</text>
  <text x="315" y="240" font-family="'Courier New', monospace" font-size="16" fill="#10b981" opacity="0.6">#_</text>

  <!-- Logo text -->
  <rect x="145" y="348" width="110" height="26" rx="13" fill="rgba(15, 23, 42, 0.9)" stroke="url(#neonEmerald)" stroke-width="1.5" />
  <text x="200" y="365" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">ROSH4N</text>
</svg>
