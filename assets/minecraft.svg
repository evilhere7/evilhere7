<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a12" />
      <stop offset="50%" stop-color="#0f291e" />
      <stop offset="100%" stop-color="#050e09" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="redBedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <filter id="mcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#mcBgGrad)" />
  <rect width="100%" height="100%" fill="url(#pixelGrid)" />

  <!-- Ambient Glow -->
  <circle cx="260" cy="180" r="160" fill="#10b981" opacity="0.12" filter="url(#mcGlow)"/>
  <circle cx="540" cy="200" r="140" fill="#ef4444" opacity="0.08" filter="url(#mcGlow)"/>

  <!-- Minecraft Voxel Isometric Block Composition -->
  <g transform="translate(180, 50)">
    <!-- Server Console Frame Behind Block -->
    <rect x="20" y="30" width="400" height="240" rx="12" fill="rgba(6, 20, 14, 0.85)" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.5" />
    <rect x="20" y="30" width="400" height="30" rx="12" fill="rgba(16, 185, 129, 0.1)" />
    <text x="40" y="50" font-family="'Courier New', monospace" font-size="12" fill="#34d399">[Server/INFO] Starting Minecraft Spigot / Paper Server v1.20...</text>
    <text x="40" y="70" font-family="'Courier New', monospace" font-size="11" fill="#6ee7b7">[Plugins] Loaded BedWarsAI, AutoQueue, AutomationCore</text>
    <text x="40" y="90" font-family="'Courier New', monospace" font-size="11" fill="#a7f3d0">[Ready] TPS: 20.0 | Memory: 1.2GB/4GB | Status: Online</text>

    <!-- Isometric Minecraft Grass/Diamond Block -->
    <g transform="translate(130, 95)">
      <!-- Top Face (Green / Emerald Grid) -->
      <polygon points="90,10 170,55 90,100 10,55" fill="#10b981" stroke="#059669" stroke-width="2" />
      <polygon points="90,20 150,55 90,88 30,55" fill="#34d399" opacity="0.6" />
      
      <!-- Left Face (Dirt/Rock) -->
      <polygon points="10,55 90,100 90,180 10,135" fill="#047857" stroke="#065f46" stroke-width="2" />
      <!-- Pixel detail on left -->
      <rect x="30" y="90" width="16" height="16" fill="#065f46" transform="skewY(27)" opacity="0.7"/>
      <rect x="60" y="110" width="14" height="14" fill="#059669" transform="skewY(27)" opacity="0.8"/>

      <!-- Right Face (Dark Dirt/Rock) -->
      <polygon points="90,100 170,55 170,135 90,180" fill="#065f46" stroke="#064e3b" stroke-width="2" />
      <!-- Pixel detail on right -->
      <rect x="110" y="90" width="16" height="16" fill="#047857" transform="skewY(-27)" opacity="0.7"/>
      <rect x="135" y="110" width="14" height="14" fill="#34d399" transform="skewY(-27)" opacity="0.8"/>

      <!-- Floating BedWars Red Bed Voxel icon -->
      <g transform="translate(140, 20)">
        <rect x="0" y="0" width="45" height="22" rx="4" fill="url(#redBedGrad)" stroke="#ffffff" stroke-width="1.5" />
        <rect x="0" y="0" width="12" height="22" rx="2" fill="#ffffff" />
        <circle cx="26" cy="11" r="3" fill="#ffffff" opacity="0.7" />
      </g>

      <!-- Sword / Plugin automation gear -->
      <g transform="translate(-20, 20)">
        <circle cx="20" cy="20" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <path d="M 12 28 L 28 12 M 24 12 L 28 12 L 28 16 M 15 25 L 12 28 L 15 31" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="395" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">Minecraft &amp; BedWars Server Engineering</text>
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" text-anchor="middle">Java • Plugins • Server Automation • Custom Mechanics • AI Experiments</text>
</svg>
