<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140727" />
      <stop offset="50%" stop-color="#231045" />
      <stop offset="100%" stop-color="#0c0517" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad2)" />
  <rect width="100%" height="100%" fill="url(#grid2)" />

  <!-- Ambient Glow -->
  <circle cx="220" cy="190" r="150" fill="#ec4899" opacity="0.1" filter="url(#glow2)"/>
  <circle cx="580" cy="220" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow2)"/>

  <!-- Center Card (Phone / Social Video Feed Concept) -->
  <g transform="translate(240, 45)">
    <!-- Smartphone / Feed frame -->
    <rect x="70" y="20" width="180" height="285" rx="24" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" />
    
    <!-- Notch / Header -->
    <rect x="125" y="28" width="70" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
    
    <!-- Video Player Simulation -->
    <rect x="80" y="44" width="160" height="205" rx="16" fill="#1e1b4b" />
    
    <!-- Gradient Video Content preview -->
    <rect x="80" y="44" width="160" height="205" rx="16" fill="url(#purpleGrad)" opacity="0.4" />
    
    <!-- Play button overlay -->
    <circle cx="160" cy="140" r="24" fill="rgba(0, 0, 0, 0.5)" stroke="#ffffff" stroke-width="1.5" />
    <polygon points="154,128 172,140 154,152" fill="#ffffff" />
    
    <!-- Social Action Bar on Right -->
    <g transform="translate(210, 105)">
      <!-- Like Heart -->
      <circle cx="12" cy="12" r="10" fill="rgba(255, 255, 255, 0.2)" />
      <path d="M 12 16 L 8 12 C 6 10 6 7 8 6 C 10 5 11 6 12 7 C 13 6 14 5 16 6 C 18 7 18 10 16 12 Z" fill="#f43f5e" />
      
      <!-- Comment Bubble -->
      <circle cx="12" cy="38" r="10" fill="rgba(255, 255, 255, 0.2)" />
      <circle cx="12" cy="37" r="4" fill="#38bdf8" />
      
      <!-- Share Arrow -->
      <circle cx="12" cy="64" r="10" fill="rgba(255, 255, 255, 0.2)" />
      <polygon points="10,60 15,64 10,68" fill="#10b981" />
    </g>

    <!-- Bottom creator info -->
    <circle cx="96" cy="225" r="8" fill="#a855f7" />
    <rect x="110" y="220" width="60" height="4" rx="2" fill="#ffffff" />
    <rect x="110" y="228" width="40" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.5)" />

    <!-- Navigation bar bottom -->
    <line x1="80" y1="255" x2="240" y2="255" stroke="rgba(255, 255, 255, 0.08)" />
    <circle cx="105" cy="270" r="4" fill="#ec4899" />
    <circle cx="160" cy="270" r="6" fill="#38bdf8" />
    <circle cx="215" cy="270" r="4" fill="#94a3b8" />
  </g>

  <!-- Left Floating Community Bubble -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="130" height="60" rx="12" fill="rgba(30, 27, 75, 0.8)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5" />
    <circle cx="24" cy="30" r="12" fill="url(#purpleGrad)" />
    <rect x="44" y="22" width="70" height="6" rx="3" fill="#ffffff" />
    <rect x="44" y="34" width="45" height="4" rx="2" fill="#94a3b8" />
  </g>

  <!-- Right Floating Realtime Bubble -->
  <g transform="translate(560, 160)">
    <rect x="0" y="0" width="140" height="60" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="24" cy="30" r="6" fill="#10b981" />
    <rect x="40" y="22" width="80" height="6" rx="3" fill="#ffffff" />
    <text x="40" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Live Community</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="395" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">Community &amp; Video Social Media</text>
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" text-anchor="middle">React • JavaScript • Supabase • Firebase</text>
</svg>
